<section class="labels-page" id="phoenixLabelsPage">

  <div class="labels-hero">
    <div>
      <div class="labels-kicker">PHOENIX</div>
      <h1>🏷️ Labels</h1>
      <p>
        Organisiere dein komplettes Smart Home mit Labels.
      </p>
    </div>
  </div>

  <div class="labels-stats">

    <div class="label-stat">
      <strong id="labelsTotal">...</strong>
      <span>Labels</span>
    </div>

    <div class="label-stat">
      <strong id="labelsUsed">...</strong>
      <span>Genutzt</span>
    </div>

    <div class="label-stat">
      <strong id="labelsUnused">...</strong>
      <span>Ungenutzt</span>
    </div>

  </div>

  <div class="labels-toolbar">

    <input
      id="labelsSearch"
      placeholder="Labels suchen..."
      autocomplete="off">

    <select id="labelsFilter">
      <option value="all">Alle</option>
      <option value="used">Genutzt</option>
      <option value="unused">Ungenutzt</option>
    </select>

  </div>

  <div class="labels-content">

      <div
          id="labelsGrid"
          class="labels-grid">
      </div>

      <aside
          id="labelsDetails"
          class="labels-details">

          <h3>🏷️ Label Details</h3>

          <p>
              Wähle links ein Label aus.
          </p>

      </aside>

  </div>

</section>
